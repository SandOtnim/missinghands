<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>เข็มที่หายไป · THE MISSING HANDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@200;300;400;500;600&family=Noto+Sans+Thai:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e8eaee; --dim:#8d97a6; --panel:#0a0d13ee; --line:#1e2733;
    --accent:#c9a227; --warn:#d9534f; --paper:#e9e4d6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070a;color:var(--ink);overflow:hidden;
    font-family:"Noto Sans Thai","Sarabun","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{user-select:none}

  /* ---------- stage ---------- */
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070a}
  #frame{position:relative;width:100%;max-width:calc(100vh * 16 / 9);aspect-ratio:16/9;
    max-height:100vh;background:#080b10;overflow:hidden}
  #sceneimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:saturate(.82) contrast(1.06) brightness(.94);transition:opacity .45s}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 32%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.88) 100%)}
  #grain{position:absolute;inset:-50%;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    animation:grain 1.1s steps(4) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}
    50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(3%,1%)}}
  #missing{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:linear-gradient(160deg,#0b1017,#05070a 60%,#0d131b);color:#5d6a7b;text-align:center;padding:24px}
  #missing b{color:#8d97a6;font-size:clamp(15px,2.4vw,22px);letter-spacing:.02em}
  #missing span{font-size:12px;letter-spacing:.12em;text-transform:uppercase}

  /* ---------- hotspots ---------- */
  .hs{position:absolute;border-radius:12px;cursor:pointer;transition:.18s;
    border:1.5px solid transparent;background:transparent}
  .hs:after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
    border-radius:50%;background:#fff;opacity:.34;box-shadow:0 0 12px 3px rgba(255,255,255,.35);
    animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.55;transform:scale(1.15)}}
  .hs.door:after{width:9px;height:9px;background:var(--accent);box-shadow:0 0 14px 4px rgba(143,214,176,.45)}
  .hs:hover,.hs.reveal{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.07);
    box-shadow:inset 0 0 32px rgba(255,255,255,.09)}
  .hs.door:hover,.hs.door.reveal{border-color:rgba(143,214,176,.65);background:rgba(143,214,176,.09)}
  .hs .tip{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;
    background:#000c;border:1px solid var(--line);padding:5px 11px;border-radius:8px;font-size:13px;
    opacity:0;transition:.15s;pointer-events:none;letter-spacing:.01em}
  .hs:hover .tip,.hs.reveal .tip{opacity:1}

  /* ---------- dialogue ---------- */
  #say{position:absolute;left:0;right:0;bottom:0;padding:22px clamp(16px,5vw,64px) clamp(20px,4vh,44px);
    background:linear-gradient(transparent,rgba(3,5,8,.82) 22%,rgba(3,5,8,.96));
    display:none;cursor:pointer;z-index:20}
  #saytext{max-width:820px;margin:0 auto;font-size:clamp(15px,1.65vw,19px);line-height:1.85;
    white-space:pre-wrap;text-shadow:0 2px 14px #000}
  #saymore{max-width:820px;margin:12px auto 0;font-size:11.5px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;animation:blink 1.7s infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:.9}}

  /* ---------- hud ---------- */
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;
    padding:10px clamp(10px,2vw,20px);z-index:15;
    background:linear-gradient(rgba(3,5,8,.78),transparent)}
  #where{font-size:clamp(11px,1.3vw,13px);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{background:#0c1119cc;border:1px solid var(--line);color:var(--ink);padding:7px 12px;
    border-radius:9px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .btn:hover{background:#141c28;border-color:#33445a}
  .btn.badge{position:relative}
  .btn.badge i{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#04150c;
    font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}

  /* ---------- bag ---------- */
  #bag{position:absolute;left:0;right:0;bottom:0;display:flex;gap:7px;justify-content:center;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:14;flex-wrap:wrap;
    background:linear-gradient(transparent,rgba(3,5,8,.72))}
  .slot{background:#0b1119dd;border:1px solid var(--line);border-radius:9px;padding:6px 11px;
    font-size:12.5px;cursor:pointer;transition:.15s;color:var(--dim)}
  .slot:hover{color:var(--ink);border-color:#3a4c63}
  .slot.on{border-color:var(--accent);color:var(--accent);background:#0e1c17}

  /* ---------- modal ---------- */
  .mod{position:fixed;inset:0;z-index:76;display:none;align-items:center;justify-content:center;
    background:rgba(2,4,7,.86);backdrop-filter:blur(7px);padding:16px}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    width:min(760px,100%);max-height:88vh;overflow:auto;padding:clamp(18px,3vw,30px);
    box-shadow:0 30px 80px #000c}
  .sheet h2{margin:0 0 4px;font-size:clamp(17px,2.2vw,22px);letter-spacing:.01em}
  .sheet h3{margin:22px 0 9px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
  .close{float:right;margin:-6px -6px 0 0}
  .paper{background:linear-gradient(#f3efe2,#e6e0cf);color:#1e1a13;border-radius:10px;
    padding:clamp(18px,3vw,30px);white-space:pre-wrap;line-height:1.95;font-size:clamp(14px,1.5vw,16px);
    box-shadow:inset 0 0 60px rgba(120,100,60,.22);font-family:"Noto Serif Thai",Georgia,serif}
  .paper b{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:#6b5f45;margin-bottom:14px}
  .card{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;
    background:#0b1017;cursor:pointer;transition:.15s}
  .card:hover{border-color:#3a4c63;background:#0f151f}
  .card.on{border-color:var(--accent);background:#0e1c17}
  .card.done{border-color:#2d5f45;background:#0a1712}
  .card b{display:block;margin-bottom:4px;font-size:14.5px}
  .card small{color:var(--dim);line-height:1.7;font-size:12.8px}
  .muted{color:var(--dim);font-size:13px;line-height:1.8}

  /* ---------- keypad ---------- */
  #dial{display:flex;gap:9px;justify-content:center;margin:18px 0}
  #dial span{width:clamp(42px,10vw,56px);height:clamp(56px,13vw,72px);border:1px solid var(--line);
    border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(22px,5vw,30px);background:#080c12;font-variant-numeric:tabular-nums}
  #pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:290px;margin:0 auto}
  #pad button{aspect-ratio:1.5;font-size:19px;background:#0c1119;border:1px solid var(--line);
    color:var(--ink);border-radius:11px;cursor:pointer;font-family:inherit}
  #pad button:active{background:#182231}

  /* ---------- ranat ---------- */
  #bars{display:flex;gap:8px;justify-content:center;align-items:flex-end;margin:22px 0;height:150px}
  #bars i{flex:1;max-width:52px;background:linear-gradient(#6b4a25,#3d2913);border:1px solid #12212e;
    border-radius:6px;cursor:pointer;transition:.12s;display:block}
  #bars i:hover{filter:brightness(1.4)}
  #bars i.hit{filter:brightness(2);transform:translateY(4px)}

  /* ---------- scare ---------- */
  #scare{position:fixed;inset:0;z-index:90;display:none;background:#000}
  #scare img{width:100%;height:100%;object-fit:cover;filter:contrast(1.5) saturate(.4) brightness(1.1)}
  .shake{animation:shk .42s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shk{10%,90%{transform:translate3d(-3px,2px,0)}20%,80%{transform:translate3d(6px,-4px,0)}
    30%,50%,70%{transform:translate3d(-11px,5px,0)}40%,60%{transform:translate3d(11px,-5px,0)}}
  #flash{position:fixed;inset:0;z-index:91;background:#fff;opacity:0;pointer-events:none}

  /* ---------- toast ---------- */
  #toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:30;
    display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
  .tst{background:#0c1119ee;border:1px solid var(--accent);color:var(--accent);padding:9px 17px;
    border-radius:10px;font-size:13px;animation:tin .35s;box-shadow:0 8px 30px #000a}
  @keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

  /* ================= เมนูหลัก (ระบบกลาง SANDOTNIM GAMES) ================= */
  #title{position:fixed;inset:0;z-index:70;background:#05070a;overflow:hidden;display:block}
  #tBgWrap{position:absolute;inset:0;will-change:transform}
  #tBg{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.4s ease}
  #tBg.on{opacity:1}
  .tScrim{position:absolute;inset:0;pointer-events:none}
  .tScrim.a{background:rgba(0,0,0,.14)}
  .tScrim.v{background:radial-gradient(132% 100% at 62% 38%,transparent 28%,rgba(0,0,0,.82) 100%)}
  .tScrim.l{background:linear-gradient(95deg,rgba(0,0,0,.80) 0%,rgba(0,0,0,.36) 34%,transparent 60%)}
  .tScrim.b{background:linear-gradient(0deg,rgba(0,0,0,.68) 0%,transparent 44%)}
  #tDust{position:absolute;inset:0;pointer-events:none}
  #tShaft{position:absolute;top:-40%;left:35%;width:60%;height:190%;transform:rotate(16deg);
    pointer-events:none;mix-blend-mode:screen;filter:blur(26px);
    background:linear-gradient(90deg,transparent,rgba(201,162,39,.30) 42%,rgba(143,214,176,.12) 52%,transparent)}
  .tMark{position:absolute;top:26px;left:7%;display:flex;align-items:center;gap:9px;z-index:3;
    font-size:10px;letter-spacing:.35em;color:var(--dim)}
  .tMark i{width:16px;height:1px;background:var(--accent);display:block}
  .tBrand{position:absolute;top:11%;left:7%;right:7%}
  .tPlate{position:absolute;inset:-40px -90px -50px -70px;pointer-events:none;filter:blur(26px);
    background:radial-gradient(closest-side at 22% 50%,rgba(0,0,0,.5),rgba(0,0,0,.22) 55%,transparent 82%)}
  #title h1{position:relative;margin:0;font-family:"Noto Serif Thai",Georgia,serif;font-weight:600;
    font-size:clamp(34px,5.2vw,66px);line-height:.98;letter-spacing:4px;
    text-shadow:0 2px 6px rgba(0,0,0,.72),0 8px 44px rgba(0,0,0,.8);
    opacity:0;transform:translateY(14px);transition:1s cubic-bezier(.16,1,.3,1) .3s}
  #title p{position:relative;margin:14px 0 0;color:#ffffffc4;font-weight:300;text-transform:none;
    font-size:clamp(9px,.94vw,12px);letter-spacing:.42em;line-height:1.7;max-width:620px;
    text-shadow:0 2px 14px rgba(0,0,0,.8);
    opacity:0;transform:translateY(14px);transition:1s cubic-bezier(.16,1,.3,1) .42s}
  .tHair{position:relative;margin-top:34px;width:0;height:1px;background:var(--accent);
    box-shadow:0 0 10px var(--accent);transition:width 1.4s cubic-bezier(.16,1,.3,1) .85s}
  #title.ready h1,#title.ready p{opacity:1;transform:none}
  #title.ready .tHair{width:130px}
  #tNav{position:absolute;bottom:17%;left:7%;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
  .titem{position:relative;background:none;border:0;cursor:pointer;padding:2px 0;text-align:left;
    font-family:"Noto Serif Thai",Georgia,serif;font-weight:300;color:#ffffffab;
    font-size:clamp(15px,1.9vw,24.5px);letter-spacing:2px;
    text-shadow:0 2px 5px rgba(0,0,0,.72),0 6px 26px rgba(0,0,0,.8);
    opacity:0;transform:translateX(-12px);
    transition:color .26s,transform .34s cubic-bezier(.16,1,.3,1),opacity .6s,letter-spacing .26s}
  .titem.in{opacity:1;transform:none}
  .titem::before{content:"";position:absolute;left:-20px;top:50%;width:0;height:1px;
    background:var(--accent);box-shadow:0 0 12px var(--accent);
    transition:width .3s cubic-bezier(.16,1,.3,1)}
  .titem:hover{color:#fff;transform:translateX(5px);letter-spacing:3px}
  .titem:hover::before{width:12px}

  #hint{position:absolute;right:12px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:16}
  #dev{position:fixed;left:6px;bottom:6px;color:#0f0;font:11px monospace;z-index:99;display:none}
  @media (max-width:640px){
    #saytext{font-size:15px;line-height:1.8}
    .btn{padding:7px 10px;font-size:12px}
    #where{letter-spacing:.1em}
  }
  /* ================= สมุดคดี — แฟ้ม 3 มิติ ================= */

  #load{position:fixed;inset:0;z-index:72;display:none;background:#05070a;overflow:hidden}
  #load.on{display:block}
  #lBgWrap{position:absolute;inset:0;will-change:transform}
  #lBg{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1s}
  #lBg.on{opacity:1}
  #load .sc{position:absolute;inset:0;pointer-events:none}
  #load .sc.v{background:radial-gradient(132% 100% at 60% 40%,transparent 26%,rgba(0,0,0,.86) 100%)}
  #load .sc.b{background:linear-gradient(0deg,rgba(0,0,0,.82) 0%,transparent 48%)}
  #load .wrap{position:absolute;left:7%;right:7%;bottom:12%}
  #load .gname{font-family:"Noto Serif Thai",Georgia,serif;font-weight:400;letter-spacing:.08em;
    font-size:clamp(18px,2.4vw,30px);text-shadow:0 4px 30px #000}
  #load .tip{margin-top:1.5em;font-size:clamp(12px,1.1vw,15px);color:var(--dim);max-width:540px;
    line-height:1.8;min-height:3.6em;transition:opacity .5s;text-shadow:0 2px 16px #000}
  #load .barwrap{margin-top:2.1em;display:flex;align-items:center;gap:16px;max-width:520px}
  #load .bar{flex:1;height:1px;background:#ffffff24;position:relative;overflow:hidden}
  #load .bar span{position:absolute;inset:0 auto 0 0;width:0%;background:var(--accent);
    box-shadow:0 0 12px var(--accent);transition:width .25s linear}
  #load .pct{font-size:12px;letter-spacing:.14em;color:var(--dim);min-width:40px;text-align:right;
    font-variant-numeric:tabular-nums}

  /* ================= มือถือ ================= */
  #mob{display:none}

  @media (orientation:portrait) and (max-width:820px){
    #stage{flex-direction:column;align-items:stretch;justify-content:flex-start;overflow-y:auto}
    #frame{width:100%;max-width:none;max-height:none;flex:none}
    #mob{display:flex;flex-direction:column;gap:11px;flex:1;background:#05070a;
         padding:15px 14px calc(20px + env(safe-area-inset-bottom))}
    #mob #say{position:static;padding:0;background:none;order:1;display:none}
    #mob #saytext{font-size:16.5px;line-height:1.9;max-width:none;text-shadow:none}
    #mob #saymore{margin:11px 0 0;text-align:right;max-width:none}
    #mob #bag{position:static;order:4;padding:0;background:none;justify-content:flex-start}
    #mob .slot{padding:11px 15px;font-size:14px}
    #mob #hud{position:static;order:5;flex-wrap:wrap;padding:0;background:none;gap:8px;margin-top:2px}
    #mob #where{flex:1 0 100%;font-size:12px;letter-spacing:.24em;margin-bottom:3px}
    #mob .btn{padding:12px 14px;font-size:14px;flex:1;min-width:86px;text-align:center}
    #mob #bSet{flex:0 0 58px;min-width:0}
    #mob #bLang{flex:0 0 88px;min-width:0}
    /* ปุ่ม "แสดงจุดที่กดได้" ยังต้องมีในโหมดง่าย — กระเป๋าย้ายลงแผงแล้วเลยเลื่อนลงได้ */
    #hint{bottom:8px;right:8px;padding:6px 10px;font-size:11.5px}
    #hots .tip{font-size:10.5px;padding:3px 7px}
    .titem{padding:11px 0;font-size:19px;letter-spacing:1.6px}
    #tMenu{gap:2px}
    .mpCard input{font-size:16px}
    .sheet,.paper{font-size:15.5px}
  }
  /* มือถือแนวนอน — จอเตี้ย บีบทุกอย่างให้พอดี */
  @media (orientation:landscape) and (max-height:520px){
    #frame{max-height:100vh}
    .btn{padding:6px 10px;font-size:12px}
    #say{padding:14px 5vw 15px}
    #saytext{font-size:15px;line-height:1.72}
    #bag{padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
    .slot{padding:5px 10px;font-size:12px}
  }
  /* ---- แฟ้มคดีบนมือถือแนวตั้ง: แฟ้มอยู่บน ข้อความอยู่ล่าง เลื่อนอ่านได้ ---- */

  /* ---------- เลือกโหมดยาก-ง่าย ---------- */
  .mdopt{display:block;width:100%;text-align:left;background:#0c1119;border:1px solid var(--line);
    border-radius:13px;padding:17px 19px;margin-bottom:11px;cursor:pointer;font-family:inherit;
    color:var(--ink);transition:.16s}
  .mdopt:hover{border-color:var(--accent);background:#101a24}
  .mdopt:active{transform:scale(.99)}
  .mdopt b{display:block;font-family:"Noto Serif Thai",Georgia,serif;font-weight:500;
    font-size:18px;margin-bottom:5px}
  .mdopt span{display:block;font-size:12.5px;color:var(--dim);line-height:1.75}
  @media (max-width:820px){.mdopt{padding:19px 17px}.mdopt b{font-size:17px}}

  /* ================= ปริศนา (escape room) ================= */
  #puzWrap{max-width:640px}
  #puzWrap.wide{max-width:820px}
  .pzT{margin:0 0 3px;font-family:"Noto Serif Thai",Georgia,serif;font-weight:500;
    font-size:clamp(18px,2.3vw,23px);letter-spacing:.01em}
  .pzC{font-size:10.5px;letter-spacing:.36em;color:var(--dim);text-transform:uppercase;margin-bottom:18px}
  .pzMsg{min-height:22px;margin-top:15px;font-size:13px;letter-spacing:.04em;color:var(--dim);text-align:center}
  .pzMsg.good{color:var(--accent)}
  .pzMsg.bad{color:var(--warn)}
  .pzHint{margin-top:14px;font-size:12px;color:#66707f;line-height:1.85;text-align:center}
  .pzRow{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}

  /* --- แป้นรหัส --- */
  #dial{display:flex;gap:9px;justify-content:center;margin:16px 0}
  #dial span{width:clamp(42px,10vw,56px);height:clamp(56px,13vw,72px);border:1px solid var(--line);
    border-radius:10px;background:#0c1119;display:flex;align-items:center;justify-content:center;
    font-size:clamp(23px,5vw,29px);font-family:"Noto Serif Thai",Georgia,serif;color:var(--accent)}
  #pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:290px;margin:0 auto}
  #pad button{aspect-ratio:1.5;font-size:19px;background:#0c1119;border:1px solid var(--line);
    border-radius:10px;color:var(--ink);cursor:pointer;font-family:inherit}
  #pad button:active{background:#182231}

  /* --- สลักดาว 4 วง --- */
  .stRow{display:flex;gap:clamp(8px,2.4vw,18px);justify-content:center;margin:20px 0 6px}
  .stCell{text-align:center}
  .stBtn{width:clamp(58px,15vw,86px);height:clamp(58px,15vw,86px);border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#1a2330,#080c12);border:1px solid #2b3646;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s;padding:0}
  .stBtn:hover{border-color:var(--accent);box-shadow:0 0 0 3px #c9a2271f}

  .docWrap.dark .docCap{color:#5f6b7c}
  .docTx{margin-top:13px;font-size:13.5px;line-height:1.95;white-space:pre-wrap}

  /* จอสัมผัส: โหมดง่ายให้เห็นแค่กรอบ ไม่ต้องโชว์ชื่อทุกอันพร้อมกัน (รก) */
  @media (hover:none){
    .hs.reveal .tip{opacity:0}
    .hs .tip{font-size:11px;padding:4px 8px}
  }

/* ---------------- ภาพใบ้ / เอกสาร (วาดเองทั้งหมด อ่านชัดทุกจอ) ---------------- */
const CHALK = '#dfe6ee', PAPER = '#2b2418';

function svgBottle(x, y, s){
  return '<g transform="translate('+x+','+y+') scale('+s+')" fill="none" stroke="'+CHALK+
    '" stroke-width="2.4" stroke-linejoin="round"><path d="M-5 0 h10 v-9 q0 -3 -2.4 -4.4 v-5.6 h-5.2 v5.6 Q-5 -12 -5 -9 Z"/></g>';
}
function svgStar(pts, r, cx, cy, cls){
  let d = "";
  for(let i=0;i<pts*2;i++){
    const a = -Math.PI/2 + i*Math.PI/pts, rr = i%2 ? r*0.42 : r;
    d += (i?" ":"") + (cx+Math.cos(a)*rr).toFixed(1) + "," + (cy+Math.sin(a)*rr).toFixed(1);
  }
  return '<polygon points="'+d+'" '+(cls||"")+'/>';
}
const ROMAN = ["XII","I","II","III","IV","V","VI","VII","VIII","IX","X","XI"];

const DOCS = {
  /* 1 · ชอล์กบนผนังห้องใต้ดิน → รหัส 174 */
  chalk:{
    title:{th:"รอยชอล์กบนผนัง",en:"Chalk on the wall"}, dark:true,

      rows.forEach(r=>{
        s+='<line x1="24" y1="'+(r.y+8)+'" x2="300" y2="'+(r.y+8)+'" stroke="'+CHALK+
           '" stroke-width="2.4" opacity=".8"/>';
        for(let i=0;i<r.n;i++) s+=svgBottle(42+i*30, r.y, 1);
        s+='<circle cx="345" cy="'+(r.y-6)+'" r="17" fill="none" stroke="'+CHALK+'" stroke-width="2.4"/>'+
           '<text x="345" y="'+(r.y+1)+'" text-anchor="middle" font-size="20" fill="'+CHALK+
           '" font-family="Georgia,serif">'+r.tag+'</text>';
      });
      return s+'</svg>';
    })(),
    text:{th:"", en:""}
  },

  /* 2 · การ์ดกลุ่มดาว → 5 · 3 · 7 · 4 */
  starcard:{
    title:{th:"การ์ดที่ปักไว้บนผนัง",en:"The card pinned to the wall"},
    cap:{th:"ห้องเก็บของ",en:"Storeroom"},
    svg:(()=>{
      const sets=[
        {t:"I",  p:[[26,26],[62,16],[88,44],[54,58],[20,62]]},
        {t:"II", p:[[24,24],[70,34],[46,64]]},
        {t:"III",p:[[18,22],[48,14],[80,26],[92,52],[62,48],[34,58],[16,54]]},
        {t:"IV", p:[[24,20],[76,24],[84,58],[30,58]]}
      ];
      let s='<svg viewBox="0 0 460 150" xmlns="http://www.w3.org/2000/svg">';
      sets.forEach((set,i)=>{
        const ox=8+i*114;
        s+='<rect x="'+ox+'" y="10" width="102" height="94" rx="6" fill="none" stroke="#9c927c" stroke-width="1.3"/>';
        for(let a=0;a<set.p.length-1;a++)
          s+='<line x1="'+(ox+set.p[a][0])+'" y1="'+(set.p[a][1]+22)+'" x2="'+(ox+set.p[a+1][0])+
             '" y2="'+(set.p[a+1][1]+22)+'" stroke="#b6ac93" stroke-width=".9" opacity=".75"/>';
        set.p.forEach(pt=> s+='<circle cx="'+(ox+pt[0])+'" cy="'+(pt[1]+22)+'" r="4.1" fill="'+PAPER+'"/>');
        s+='<text x="'+(ox+51)+'" y="128" text-anchor="middle" font-size="17" fill="'+PAPER+
           '" font-family="Georgia,serif" letter-spacing="2">'+set.t+'</text>';
      });
      return s+'</svg>';
    })(),
    text:{th:"", en:""}
  },

  /* 3 · ตราพระจันทร์บนตู้กระจก */
  moon:{
    title:{th:"ตราบนบานกระจก",en:"The mark on the glass door"},
    cap:{th:"ห้องสมุด",en:"Library"},
    svg:(()=>{
      let s='<svg viewBox="0 0 400 110" xmlns="http://www.w3.org/2000/svg">';
      const ph=[0,.2,.5,.8,1];
      ph.forEach((p,i)=>{
        const cx=48+i*76, cy=46, r=23;
        s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#cfc6ae" opacity=".33"/>';
        if(p>0){
          const k=(p-.5)*2*r;
          s+='<path d="M '+cx+' '+(cy-r)+' A '+r+' '+r+' 0 0 1 '+cx+' '+(cy+r)+
             ' A '+Math.abs(k)+' '+r+' 0 0 '+(k<0?1:0)+' '+cx+' '+(cy-r)+' Z" fill="'+PAPER+'"/>';
        }
      });
      s+='<path d="M28 92 H360" stroke="'+PAPER+'" stroke-width="1.6"/>'+
          '<path d="M352 86 l10 6 l-10 6" fill="none" stroke="'+PAPER+'" stroke-width="1.6"/>';
      return s+'</svg>';
    })(),
    text:{th:"", en:""}

  /* 4 · แผนที่ดาว → วงนอก IX · วงกลาง IV · วงใน XI */
  chart:{
    title:{th:"แผนที่ดาว",en:"Star chart"},
    cap:{th:"ในตู้กระจก",en:"From the glass cabinet"},
    svg:(()=>{
      const C=150, tgt=[9,4,11], rad=[126,94,62], pts=[6,5,4];
      let s='<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">';
      s+='<circle cx="150" cy="150" r="140" fill="none" stroke="#a89d85" stroke-width="1.2"/>';
      for(let i=0;i<12;i++){
        const a=-Math.PI/2+i*Math.PI/6;

/* ---------------- เสียง (สังเคราะห์ ไม่มีไฟล์) ---------------- */
let AC = null;
function actx(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(f, dur, type, vol, slideTo){
  if(!S.snd) return; const c = actx(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, c.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + dur);
  g.gain.setValueAtTime(0, c.currentTime);
  g.gain.linearRampToValueAtTime(vol==null?0.16:vol, c.currentTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur + 0.05);
}
function sfx(k){
  if(!S.snd) return;
  if(k==="click")  tone(320, .06, "triangle", .07);
  if(k==="step")   tone(120, .18, "sine", .09, 90);
  if(k==="good")   { tone(660,.14,"sine",.11); setTimeout(()=>tone(990,.3,"sine",.1),110); }
  if(k==="bad")    tone(150, .22, "sawtooth", .07, 96);
  if(k==="doc")    tone(2100, .05, "square", .025);
  if(k==="open")   { tone(90,.5,"sine",.14,60); setTimeout(()=>tone(420,.28,"triangle",.07),130); }
  if(k==="tick")   tone(1400, .03, "square", .03);
}
function bellTone(i){
  if(!S.snd) return; const c = actx(); if(!c) return;
  const base = [523.25, 349.23, 220][i];
  [1, 2.02, 2.98, 4.1].forEach((m, n)=>{
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = base*m;
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(0.16/(n+1.4), c.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 2.4 - n*0.35);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 2.6);
  });
}

function toast(text){
  const d = document.createElement("div"); d.className="tst"; d.textContent = text;
  $("toast").appendChild(d);
  setTimeout(()=>{ d.style.transition=".5s"; d.style.opacity="0"; setTimeout(()=>d.remove(),520); }, 2300);

function ok(c){
  if(!c) return true;
  if(c.has    && !S.items[c.has])   return false;
  if(c.lacks  &&  S.items[c.lacks]) return false;
  if(c.flag   && !S.flags[c.flag])  return false;
  if(c.noflag &&  S.flags[c.noflag])return false;
  return true;
}
function waitSay(txt){
  return new Promise(res=>{
    sayTxt.textContent = LT(txt);

    sayBox.style.display = "block";
    const go = () => { sayBox.style.display="none"; sayBox.removeEventListener("click",go);

    sayBox.addEventListener("click", go);
    document.addEventListener("keydown", kd);
  });
}

/* ---------------- ตัวเดินสเต็ป ---------------- */
async function run(steps){
  if(!steps) return;
  for(const s of steps){
    if(s.if && !ok(s.if)) continue;
    if(s.once){ const k = "_once_"+s.once; if(S.flags[k]) continue; S.flags[k] = 1; }
    if(s.say)     await waitSay(s.say);
    if(s.closeup) await showCloseup(s.closeup);
    if(s.doc)     await showDoc(s.doc);
    if(s.take)    give(s.take);
    if(s.set)     S.flags[s.set] = 1;
    if(s.puz)     await openPuz(s.puz);
    if(s.gearfix) await doGearfix();
    if(s.ck)      await doClock();
    if(s.goto)  { await goTo(s.goto); save(); return; }
    if(s.end)     await doEnd();
    save();
  }
  refreshHud();
}
function give(id){
  if(S.items[id]) return; S.items[id]=1;
  toast(L("gotItem")+" · "+LT(ITEMS[id].name)); sfx("good"); refreshHud(); refreshBag();
}

/* ---------------- ฉาก ---------------- */
async function goTo(id){
  S.scene = id; sfx("step");
  const sc = SCENES[id];
  sceneImg.style.opacity = "0";
  await new Promise(r=>setTimeout(r,200));
  sceneImg.onerror = ()=>{ $("missing").style.display="flex";
    $("missing").querySelector("b").textContent = LT(sc.name);
    $("missing").querySelector("span").textContent = L("imgMissing"); sceneImg.style.opacity="0"; };
  sceneImg.onload  = ()=>{ $("missing").style.display="none"; sceneImg.style.opacity="1"; };
  $("missing").style.display = "none";
  sceneImg.src = IMG[sc.img] || sc.img;
  prefetch(sc); drawHots(); refreshHud(); save();
  await run(sc.onEnter || []);
  drawHots();
}
const warmed = new Set();
function warm(k){ const u = IMG[k]; if(!u || warmed.has(k)) return; warmed.add(k);
  const i = new Image(); i.decoding="async"; i.src = u; }
function prefetch(sc){
  (sc.hotspots||[]).forEach(h=>(h.do||[]).forEach(st=>{
    if(st.goto && SCENES[st.goto]) warm(SCENES[st.goto].img);
    if(st.closeup) warm(st.closeup);
  }));
}
function drawHots(){
  const sc = SCENES[S.scene]; if(!sc) return;
  hots.innerHTML = "";
  (sc.hotspots||[]).forEach(h=>{
    if(h.show && !ok(h.show)) return;
    const d = document.createElement("div");
    d.className = "hs" + (h.kind==="door" ? " door" : "") + (reveal ? " reveal" : "");
    d.dataset.id = h.id;
    d.style.left = h.x+"%"; d.style.top = h.y+"%"; d.style.width = h.w+"%"; d.style.height = h.h+"%";
    d.innerHTML = '<span class="tip"></span>';
    d.querySelector(".tip").textContent = LT(h.label);
    d.addEventListener("click", async ()=>{
      if(busy) return; busy = true; actx(); sfx("click");
      await run(h.do || [{ say:{th:L("nothingHere"),en:L("nothingHere")} }]);
      drawHots(); busy = false;
    });
    hots.appendChild(d);
  });
}

let puzResolve = null, puzId = null, puzDone = false;
function openPuz(id){
  puzId = id; puzDone = false; const p = PUZ[id];
  $("puzT").textContent = LT(p.title);
  $("puzC").textContent = LT(p.cap);
  $("puzHint").textContent = LT(p.hint);
  $("puzMsg").textContent = ""; $("puzMsg").className = "pzMsg";
  $("puzWrap").classList.toggle("wide", p.type==="books" || p.type==="shadow");
  ({code:pzCode, stars:pzStars, shadow:pzShadow, books:pzBooks,
    dial:pzDial, clock:pzClock, bells:pzBells})[p.type](p);
  openM("mPuz");
  return new Promise(res=>{ puzResolve = res;
    const m = $("mPuz");
    const iv = setInterval(()=>{ if(m.style.display==="none"){ clearInterval(iv); const r=puzResolve; puzResolve=null; if(r) r(false); } }, 110);
  });
}
function puzWin(msg){
  if(puzDone) return; puzDone = true;
  S.flags["p_"+puzId] = 1; save();
  const m = $("puzMsg"); m.className = "pzMsg good"; m.textContent = msg || "";
  sfx("open");
  setTimeout(()=>{ const r = puzResolve; puzResolve = null; closeM("mPuz"); if(r) r(true); }, 950);
}
function puzFail(msg){
  const m = $("puzMsg"); m.className = "pzMsg bad"; m.textContent = msg || L("wrong");
  sfx("bad");
  setTimeout(()=>{ if($("puzMsg").className.indexOf("bad")>=0){ $("puzMsg").className="pzMsg"; $("puzMsg").textContent=""; } }, 1400);
}

/* --- 1 · แป้นรหัส --- */
function pzCode(p){
  let cur = "";
  $("puzBody").innerHTML = '<div id="dial"></div><div id="pad"></div>';
  const paint = ()=>{ $("dial").innerHTML = ""; for(let i=0;i<p.len;i++){
    const s=document.createElement("span"); s.textContent = cur[i]||"·"; $("dial").appendChild(s); } };
  const pad = $("pad");
  [1,2,3,4,5,6,7,8,9,"←",0,"✓"].forEach(k=>{
    const b = document.createElement("button"); b.textContent = k;
    b.onclick = ()=>{
      sfx("tick");
      if(k==="←") cur = cur.slice(0,-1);
      else if(k==="✓"){
        if(cur === p.answer) return puzWin();
        puzFail(); cur = "";
      } else if(cur.length < p.len) cur += k;
      paint();
      if(cur.length === p.len && cur === p.answer) setTimeout(()=>puzWin(), 220);
    };
    pad.appendChild(b);
  });
  paint();
}

/* --- 2 · สลักดาว --- */
function pzStars(p){
  const cur = [3,3,3,3];

  });

}

/* --- 3 · เงาเทียน (เลื่อนจนเงาประกอบเป็นกุญแจ) --- */
function pzShadow(p){
  const FRAG = [
    {d:"M96 62 a20 20 0 1 0 0 40 a20 20 0 1 0 0 -40 Z M96 73 a9 9 0 1 1 0 18 a9 9 0 1 1 0 -18 Z",
      ax:-2.9, ay:1.5, cs:.0055},
    {d:"M110 74 H246 V90 H110 Z", ax:1.1, ay:-2.1, cs:-.0034},
    {d:"M246 74 H302 V90 H246 Z M258 90 H268 V112 H258 Z M286 90 H296 V106 H286 Z",
      ax:3.4, ay:2.6, cs:.0042}
  ];
  $("puzBody").innerHTML =
    '<svg class="shWall" viewBox="0 0 400 190" id="shSvg"></svg>'+
    '<input class="shSlide" id="shR" type="range" min="0" max="100" value="14">'+
    '<div class="shNum" id="shN"></div>';
  const svg = $("shSvg"), rng = $("shR");
  function paint(){
    const v = +rng.value, dv = v - p.answer, near = Math.abs(dv) <= 1;
    let s = '<rect x="0" y="0" width="400" height="190" fill="#0b0f15"/>';
    s += '<rect x="0" y="150" width="400" height="40" fill="#070a0e"/>';
    /* ลำแสงเทียน */
    const cx = 30 + v*3.4;
    s += '<path d="M'+cx+' 168 L'+(cx-150)+' 0 L'+(cx+150)+' 0 Z" fill="#c9a227" opacity=".055"/>';
    s += '<circle cx="'+cx+'" cy="164" r="4.6" fill="#f0d98a"/>';
    s += '<ellipse cx="'+cx+'" cy="164" rx="14" ry="9" fill="#f0d98a" opacity=".16"/>';
    FRAG.forEach(f=>{
      const tx = dv*f.ax, ty = dv*f.ay, sc = 1 + dv*f.cs;
      s += '<g transform="translate('+(200+tx).toFixed(2)+','+(95+ty).toFixed(2)+') scale('+sc.toFixed(4)+
           ') translate(-200,-95)"><path d="'+f.d+'" fill="'+(near?"#e8dfc4":"#39404b")+
           '" opacity="'+(near?".95":".8")+'"/></g>';
    });
    svg.innerHTML = s;
    $("shN").textContent = near ? "· · ·" : "";
    if(near) setTimeout(()=>{ if(Math.abs(+rng.value - p.answer)<=1) puzWin(); }, 420);
  }
  rng.addEventListener("input", ()=>{ sfx("tick"); paint(); });
  paint();
}

/* --- 4 · เรียงหนังสือตามข้างขึ้น --- */
function pzBooks(p){
  const PH = [0,.2,.5,.8,1];
  const COL = ["#5c3a2a","#2f4a3d","#4a3352","#3a4256","#5a4a22"];
  let order = [3,0,4,1,2], sel = -1;
  window.__PZ = { order, get sel(){return sel;} };
  const shelf = document.createElement("div"); shelf.className = "bkShelf";
  $("puzBody").innerHTML = ""; $("puzBody").appendChild(shelf);
  function moonSVG(ph){
    const r = 19, cx = 26, cy = 30;
    let s = '<svg viewBox="0 0 52 130"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+
            '" fill="none" stroke="#cfc6ae" stroke-width="1.5" opacity=".55"/>';
    if(ph > 0){
      const k = (ph-.5)*2*r;
      s += '<path d="M '+cx+' '+(cy-r)+' A '+r+' '+r+' 0 0 1 '+cx+' '+(cy+r)+
           ' A '+Math.abs(k).toFixed(2)+' '+r+' 0 0 '+(k<0?1:0)+' '+cx+' '+(cy-r)+' Z" fill="#e3d9b6"/>';
    }
    s += '<line x1="12" y1="66" x2="40" y2="66" stroke="#cfc6ae" stroke-width="1" opacity=".3"/>';
    s += '<line x1="12" y1="76" x2="40" y2="76" stroke="#cfc6ae" stroke-width="1" opacity=".3"/>';
    return s + '</svg>';
  }
  function paint(){
    shelf.innerHTML = "";
    order.forEach((bk, pos)=>{
      const b = document.createElement("button");
      b.className = "bkItem" + (sel===pos ? " sel" : "");
      b.style.background = "linear-gradient(100deg,"+COL[bk]+",#1a1610)";
      b.innerHTML = moonSVG(PH[bk]);
      b.onclick = ()=>{
        sfx("tick");
        if(sel < 0){ sel = pos; }
        else if(sel === pos){ sel = -1; }
        else { const t = order[sel]; order[sel] = order[pos]; order[pos] = t; sel = -1; }
        paint();
        if(order.every((v,i)=>v===p.answer[i])) setTimeout(()=>puzWin(), 280);
      };
      shelf.appendChild(b);
    });
  }
  paint();
}

/* --- 5 · วงแหวนสามชั้น --- */
function pzDial(p){
  const rot = [0,0,0], RAD = [126,94,62], PTS = [6,5,4];
  window.__PZ = { rot };
  $("puzBody").innerHTML = '<div class="dlWrap"><svg viewBox="0 0 300 300" id="dlSvg"></svg></div>'+
    '<div class="dlBtns" id="dlB"></div>';
  const btns = $("dlB");
  [0,1,2].forEach(k=>{
    const g = document.createElement("div"); g.className = "pzRow";
    g.style.cssText = "gap:6px;margin:3px";
    const lab = document.createElement("span");
    lab.style.cssText = "font-size:11.5px;letter-spacing:.16em;color:var(--dim);min-width:52px";
    lab.textContent = L(["ringOuter","ringMid","ringIn"][k]);
    const bl = document.createElement("button"); bl.className = "btn"; bl.textContent = "◀";
    const br = document.createElement("button"); br.className = "btn"; br.textContent = "▶";
    bl.onclick = ()=>{ rot[k] = (rot[k]+11)%12; sfx("tick"); paint(); };
    br.onclick = ()=>{ rot[k] = (rot[k]+1)%12;  sfx("tick"); paint(); };
    g.appendChild(lab); g.appendChild(bl); g.appendChild(br); btns.appendChild(g);
  });
  function paint(){
    let s = '<circle cx="150" cy="150" r="146" fill="#0a0e14"/>';
    for(let i=0;i<12;i++){
      const a = -Math.PI/2 + i*Math.PI/6;
      s += '<text x="'+(150+Math.cos(a)*138).toFixed(1)+'" y="'+(150+Math.sin(a)*138+4.5).toFixed(1)+
           '" text-anchor="middle" font-size="12" fill="#6d7a8b" font-family="Georgia,serif">'+ROMAN[i]+'</text>';
    }
    RAD.forEach((r,k)=>{
      const hit = rot[k] === p.answer[k];
      s += '<circle cx="150" cy="150" r="'+r+'" fill="none" stroke="'+(hit?"#c9a227":"#2c3746")+
           '" stroke-width="'+(hit?"2":"1.2")+'" opacity="'+(hit?".9":".65")+'"/>';
      const a = -Math.PI/2 + rot[k]*Math.PI/6;
      s += svgStar(PTS[k], 13, 150+Math.cos(a)*r, 150+Math.sin(a)*r,
        'fill="'+(hit?"#e8dfc4":"#8d97a6")+'"');
    });
    s += '<circle cx="150" cy="150" r="4" fill="#8d97a6"/>';
    $("dlSvg").innerHTML = s;
    if(rot.every((v,i)=>v===p.answer[i])) setTimeout(()=>puzWin(), 300);
  }
  paint();
}

/* --- 6 · ตั้งเข็มนาฬิกา --- */
function pzClock(p){
  let sh = 0, lg = 0, act = 0;
  $("puzBody").innerHTML = '<div class="ckWrap"><svg viewBox="0 0 300 300" id="ckSvg"></svg></div>'+
    '<div class="ckPick"><button id="ckS"></button><button id="ckL"></button></div>';
  $("ckS").textContent = L("handShort"); $("ckL").textContent = L("handLong");
  $("ckS").onclick = ()=>{ act = 0; sfx("click"); paint(); };
  $("ckL").onclick = ()=>{ act = 1; sfx("click"); paint(); };
  function paint(){
    let s = '<circle cx="150" cy="150" r="144" fill="#0c1017"/>'+
            '<circle cx="150" cy="150" r="138" fill="none" stroke="#4a3f22" stroke-width="2"/>';
    for(let i=0;i<12;i++){
      const a = -Math.PI/2 + i*Math.PI/6;
      const x = 150+Math.cos(a)*118, y = 150+Math.sin(a)*118;
      s += '<circle class="ckHit" data-h="'+i+'" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+
           '" r="21" fill="#ffffff08" style="cursor:pointer"/>';
      s += '<text x="'+x.toFixed(1)+'" y="'+(y+5.5).toFixed(1)+'" text-anchor="middle" font-size="16" '+
           'fill="#b9ae8c" font-family="Georgia,serif" pointer-events="none">'+ROMAN[i]+'</text>';
    }
    const hand = (hr, len, w, col)=>{
      const a = -Math.PI/2 + hr*Math.PI/6;
      return '<line x1="150" y1="150" x2="'+(150+Math.cos(a)*len).toFixed(1)+'" y2="'+
        (150+Math.sin(a)*len).toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+
        '" stroke-linecap="round" pointer-events="none"/>';
    };
    s += hand(sh, 62, 9, act===0 ? "#e8dfc4" : "#9aa3b1");
    s += hand(lg, 108, 5, act===1 ? "#e8dfc4" : "#9aa3b1");
    s += '<circle cx="150" cy="150" r="7" fill="#c9a227" pointer-events="none"/>';
    $("ckSvg").innerHTML = s;
    $("ckS").classList.toggle("on", act===0);
    $("ckL").classList.toggle("on", act===1);
    $("ckSvg").querySelectorAll(".ckHit").forEach(c=>c.addEventListener("click", ()=>{
      const h = +c.dataset.h; sfx("tick");
      if(act===0) sh = h; else lg = h;
      paint();
      if(sh===p.answer[0] && lg===p.answer[1]) setTimeout(()=>puzWin(), 320);
    }));
  }
  paint();
}

/* --- 7 · ตีระฆัง --- */
function pzBells(p){
  let got = [];
  $("puzBody").innerHTML = '<div class="blRow" id="blR"></div><div class="blSeq" id="blS"></div>';
  const R = [{r:22,h:52},{r:30,h:68},{r:39,h:86}];
  R.forEach((b,i)=>{
    const btn = document.createElement("button"); btn.className = "blBtn";
    const w = b.r*2+12, h = b.h+22;
    btn.innerHTML = '<svg viewBox="0 0 '+w+' '+h+'">'+
      '<line x1="'+(w/2)+'" y1="0" x2="'+(w/2)+'" y2="10" stroke="#6f6242" stroke-width="3"/>'+
      '<path d="M'+(w/2-b.r)+' '+(b.h+8)+' q0 -'+(b.h)+' '+b.r+' -'+(b.h)+
      ' q'+b.r+' 0 '+b.r+' '+(b.h)+' Z" fill="url(#bg'+i+')"/>'+
      '<rect x="'+(w/2-b.r-4)+'" y="'+(b.h+8)+'" width="'+(b.r*2+8)+'" height="7" rx="3" fill="#7d6b3e"/>'+
      '<circle cx="'+(w/2)+'" cy="'+(b.h+21)+'" r="4.5" fill="#8d7a45"/>'+
      '<defs><linearGradient id="bg'+i+'" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0" stop-color="#a08a4e"/><stop offset=".55" stop-color="#6d5c2f"/>'+
      '<stop offset="1" stop-color="#403618"/></linearGradient></defs></svg>';
    btn.onclick = ()=>{
      bellTone(i); btn.classList.remove("ring"); void btn.offsetWidth; btn.classList.add("ring");
      got.push(i); paint();
      const n = got.length - 1;
      if(got[n] !== p.answer[n]){ got = []; setTimeout(()=>{ paint(); puzFail(); }, 420); return; }
      if(got.length === p.answer.length) setTimeout(()=>puzWin(), 700);
    };
    $("blR").appendChild(btn);
  });
  function paint(){
    let s = "";
    for(let i=0;i<p.answer.length;i++)
      s += '<i>'+(got[i]==null ? "" : ["·","••","●"][got[i]])+'</i>';
    $("blS").innerHTML = s;
  }
  paint();
}

function menuDrift(){
  const w = $("tBgWrap"); if(!w) return;
  const t = performance.now()/1000;
  const x = Math.sin(t/75*6.283)*1.8 + Math.sin(t/200*6.283)*1.1;
  const y = Math.sin(t/97*6.283)*1.2 + Math.sin(t/173*6.283)*0.7;
  w.style.transform = "scale(1.06) translate("+x.toFixed(3)+"%,"+y.toFixed(3)+"%)";
  requestAnimationFrame(menuDrift);
}
function dust(){
  const c = $("tDust"); if(!c) return; const x = c.getContext("2d");
  const R = ()=>{ c.width = c.clientWidth; c.height = c.clientHeight; };
  R(); addEventListener("resize", R);
  const N = 46, ps = Array.from({length:N}, ()=>({x:Math.random(),y:Math.random(),
    s:Math.random()*1.5+0.4, v:Math.random()*0.00016+0.00004, a:Math.random()*0.4+0.1}));
  (function loop(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.y -= p.v; if(p.y < -0.02){ p.y = 1.02; p.x = Math.random(); }
      p.x += Math.sin((performance.now()/6000)+p.y*9)*0.00012;
      x.globalAlpha = p.a; x.fillStyle = "#e6d9b4"; x.beginPath();
      x.arc(p.x*c.width, p.y*c.height, p.s, 0, 6.283); x.fill(); });
    x.globalAlpha = 1; requestAnimationFrame(loop);
  })();
}

      mirror();
      if (getComputedStyle(img).display === "none") hide();
      schedule(srcChanged);
    }).observe(img, { attributes: true, attributeFilter: ["src", "style", "class", "srcset"] });
    img.addEventListener("load", function () { schedule(true); });
    img.addEventListener("error", function () { st.job++; st.busy = null; hide(); st.key = ""; });
    if (window.ResizeObserver) new ResizeObserver(function () { var g = geometry(); if (!g || g.key !== st.key) { hide(); schedule(); } }).observe(img);
    st.schedule = schedule; st.geometry = geometry; st.hide = hide;
    ALL.push(st);
    mirror();
    if (img.complete && img.naturalWidth) schedule(true);
  }

  var ALL = [];
  // geometry changed (resize / browser zoom / other screen): drop the canvas at once — the <img> shows
  // until the new exact-size copy is ready (a stale pixelated canvas would look blocky meanwhile)
  function relayoutAll() { ALL.forEach(function (st) { var g = st.geometry(); if (!g || g.key !== st.key) { st.hide(); st.schedule(); } }); }
  addEventListener("resize", relayoutAll);
  // safety net: a box can move without resize/ResizeObserver (modal re-centres, emulated viewport,
  // events skipped while the page was not rendering) — one rect read every 0.4 s, only while a copy is showing
  setInterval(function () { if (ALL.some(function (st) { return st.shown; })) relayoutAll(); }, 400);
  // devicePixelRatio changes (browser zoom, dragging to another screen) — re-arm each time
  (function watchDpr() {
    if (!window.matchMedia) return;
    var mq = matchMedia("(resolution: " + (window.devicePixelRatio || 1) + "dppx)");
    var on = function () { relayoutAll(); if (mq.removeEventListener) mq.removeEventListener("change", on); watchDpr(); };
    if (mq.addEventListener) mq.addEventListener("change", on); else if (mq.addListener) mq.addListener(on);
  })();

  window.CrispPhoto = { attach: attach, stats: function () { return LOG.slice(); }, off: OFF, relayout: relayoutAll };
  function auto() { ["sceneimg", "cuImg"].forEach(function (id) { var el = document.getElementById(id); if (el && el.tagName === "IMG") attach(el); }); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", auto); else auto();
})();
</script>
<!-- crisp-photo:end -->
